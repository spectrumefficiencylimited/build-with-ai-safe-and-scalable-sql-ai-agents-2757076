[project]
name = "sql-ai-agent"
version = "0.0.4"
description = "Build with AI: Safe and Scalable SQL AI Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Rami Krispin" }
]
keywords = ["sql", "ai", "agent", "llm", "database", "openai", "anthropic", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=2.3.3",
    "numpy>=2.3.4",
    "plotly>=6.2.0",
    "plotly-express>=0.4.1",
    "streamlit>=1.53.0",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "marimo>=0.10.16",
    "duckdb>=1.4.2",
    "psycopg>=3.2.12",
    "ibis-framework[postgres]>=11.0.0",
    "ibis-framework[duckdb]>=11.0.0",
    "openai>=2.6.1",
    "langchain>=1.0.2",
    "langchain-community>=0.4",
    "langchain-core>=1.0.1",
    "langchain-openai>=1.0.1",
    "sqlglot>=28.5.0",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.12.0",
    "mypy>=1.5.0",
    "ipython>=8.12.0",
]

anthropic = [
    "anthropic>=0.25.0",
]

google = [
    "google-generativeai>=0.3.0",
]

all = [
    "sql-ai-agent[dev,anthropic,google]",
]

[project.urls]
Homepage = "https://github.com/RamiKrispin/build-with-ai-safe-and-scalable-sql-ai-agents-2757076"
Repository = "https://github.com/RamiKrispin/build-with-ai-safe-and-scalable-sql-ai-agents-2757076"
Issues = "https://github.com/RamiKrispin/build-with-ai-safe-and-scalable-sql-ai-agents-2757076/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# UV-specific configuration
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.12.0",
    "mypy>=1.5.0",
    "ipython>=8.12.0",
]

[tool.uv.sources]
# Specify any custom package sources if needed
# Example:
# my-package = { git = "https://github.com/user/repo.git" }

[tool.ruff]
# Ruff linter configuration
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.isort]
known-first-party = ["sql_ai_agent"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=sql_ai_agent",
    "--cov-report=term-missing",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "ibis.*",
    "langchain.*",
    "openai.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["sql_ai_agent"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
